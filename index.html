  const cov=pick(TYPES.filter(t=>!s.t.includes(t)&&t!=='NOR'),r);

  if(cm.length)seq.splice(Math.max(0,seq.length-2),0,pick(cm,r));
  const n=seq.length;
  seq.forEach((m,i)=>{const lv=Math.max(3,Math.round(3+50*Math.pow((i+1)/(n),1.25)));add(lv,m)});
  out.sort((a,b)=>a[0]-b[0]);
  return out;
}

function parseVoice(s){const out=[];let t=0;s.split(' ').forEach(tok=>{const [n,d]=tok.split(':');const du=+d;if(!du)return;out.push([n,t,du]);t+=du});return{notes:out,len:t}}
function playMusic(name,force){AU.want=name;if(!AU.ctx||!AU.on){AU.cur=null;return}if(AU.cur===name&&!force)return;stopMusic();const sg=SONGS[name];if(!sg)return;AU.cur=name;const vs=sg.v.map(parseVoice);const len=Math.max(...vs.map(v=>v.len));const sp=60/sg.bpm/2;let start=AU.ctx.currentTime+.05;const gain=AU.ctx.createGain();gain.gain.value=1;gain.connect(AU.master);AU.bus=gain;
  const sched=()=>{if(AU.cur!==name)return;vs.forEach((v,vi)=>v.notes.forEach(([n,t,d])=>{const f=nfreq(n);if(f)tone(f,start+t*sp,d*sp*.95,sg.w[vi]||'square',vi?0.28:0.16,gain)}));start+=len*sp;if(sg.once){const nm=name;AU.timer=setTimeout(()=>{if(AU.cur===nm){AU.cur=null;if(AU.after){const a=AU.after;AU.after=null;playMusic(a)}}},len*sp*1000+200);return}AU.timer=setTimeout(sched,(start-AU.ctx.currentTime-.5)*1000)};sched()}
function stopMusic(){clearTimeout(AU.timer);AU.cur=null;if(AU.bus){try{AU.bus.gain.setValueAtTime(0,AU.ctx.currentTime);AU.bus.disconnect()}catch(e){}AU.bus=null}}
function jingle(name,thenName){AU.after=thenName||AU.want;const w=AU.want;playMusic(name,true);AU.want=thenName||w}
function sfx(k){if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime;try{switch(k){
 case 'blip':tone(1200,t,.04,'square',.12);break;
 case 'sel':tone(880,t,.05,'square',.15);tone(1320,t+.05,.06,'square',.15);break;
 case 'bump':tone(110,t,.08,'square',.2);break;
 case 'hit':{const n=AU.ctx.createBufferSource(),b=AU.ctx.createBuffer(1,4000,22050),d=b.getChannelData(0);for(let i=0;i<4000;i++)d[i]=(Math.random()*2-1)*(1-i/4000);n.buffer=b;const g=AU.ctx.createGain();g.gain.value=.5;n.connect(g);g.connect(AU.master);n.start(t);break}
 case 'super':tone(300,t,.06,'square',.25);tone(600,t+.06,.1,'square',.25);sfx('hit');break;
 case 'weak':tone(200,t,.08,'square',.2);tone(150,t+.08,.1,'square',.2);break;
 case 'faint':for(let i=0;i<8;i++)tone(600-i*60,t+i*.05,.05,'square',.18);break;
 case 'ball':tone(500,t,.05,'square',.2);tone(900,t+.06,.05,'square',.2);break;
 case 'shake':tone(220,t,.06,'triangle',.4);break;
 case 'catch':[523,659,784,1046].forEach((f,i)=>tone(f,t+i*.08,.1,'square',.2));break;
 case 'heal':[784,988,1175].forEach((f,i)=>tone(f,t+i*.07,.08,'square',.15));break;
 case 'enc':for(let i=0;i<10;i++)tone(i%2?880:660,t+i*.04,.04,'square',.15);break;
 case 'door':tone(330,t,.06,'triangle',.3);tone(250,t+.06,.08,'triangle',.3);break;
 case 'item':[659,784,988,1318].forEach((f,i)=>tone(f,t+i*.09,.12,'square',.18));break;
 case 'excl':tone(1500,t,.05,'square',.2);tone(1900,t+.05,.08,'square',.2);break;
 case 'stat':for(let i=0;i<6;i++)tone(400+i*120,t+i*.03,.04,'triangle',.3);break;
 case 'statd':for(let i=0;i<6;i++)tone(1000-i*120,t+i*.03,.04,'triangle',.3);break;
}}catch(e){}}

async function battle(o){if(BS)return'run';if(!partyAlive())return'lose';
  const prev=SCN;const legend=o.wild&&SPECIES[o.wild.sp].legend;
  BS={o,wild:!!o.wild,foe:o.wild?[o.wild]:o.tr.party,ei:0,p:null,pi:0,e:null,th:o.th||G.batTh||'grass',fx:null,turn:0,part:new Set(),runs:0,showE:false,showP:false,eGround:120,trItems:o.tr?(o.tr.items||0):0,end:null,shk:0};
  setScene(BattleScene);playMusic(legend?'legend':o.wild?'battle':(o.tr.boss?'boss':'trainer'));
  await introWipe();
  BS.e=mkSide(BS.foe[0]);seen(BS.e.mon.sp);
  if(!BS.wild){BS.trSprite=true;BS.trPal=o.tr.pal;BS.trOff=0}else{BS.e.vis=true;BS.e.off=-150}
  BS.myTr=true;BS.myTrOff=150;
  for(let i=0;i<=30;i++){BS.eGround=120*(1-i/30);if(BS.wild)BS.e.off=-150*(1-i/30);BS.myTrOff=150*(1-i/30);await wait(1)}
  if(BS.wild){if(BS.e.mon.shiny){sfx('stat');await fx('X','e','#f8f080',30)}BS.showE=true;await bsay(`Un ${mname(BS.e.mon)} sauvage apparaît !`)}
  else{BS.tballs=true;await bsay(o.tr.intro||`${o.tr.cls?o.tr.cls+' ':''}${o.tr.name} veut se battre !`);BS.tballs=false;for(let i=0;i<20;i++){BS.trOff+=5;await wait(1)}BS.trSprite=false;await sendFoe(0)}
  const lead=G.party.findIndex(m=>m.hp>0);
  for(let i=0;i<15;i++){BS.myTrOff-=8;await wait(1)}BS.myTr=false;
  await sendPlayer(lead,true);
  while(BS&&!BS.end){
    const act=await playerAction();
    await doTurn(act);
    BS.turn++;
  }
  const res=BS.end;
  await fade(1,14);setScene(prev);BS=null;await wait(2);await fade(0,10);
  return res;
}
async function introWipe(){const n=36;const ov={draw(){const t=this.t/n;ctx.fillStyle='#000';for(let i=0;i<8;i++){const h=20*Math.min(1,t*1.3-i*.04);if(h>0)ctx.fillRect(0,i*20,i%2?W*t*1.5:W,h);}},update(){},t:0};sfx('enc');FADE=0;for(let k=0;k<3;k++){FADE=.6;await wait(4);FADE=0;await wait(4)}UI.push(ov);for(ov.t=0;ov.t<n;ov.t++)await wait(1);closeW(ov);}

async function playerAction(){

    if(c===0){if(mon.moves.every(m=>m.pp<=0)){await bsay(`${mname(mon)} n'a plus de capacités !`);return{type:'move',m:-1}}
      const mi=await openW(new MoveMenu(mon));if(mi<0)continue;if(mon.moves[mi].pp<=0){await bsay('Plus de PP pour cette capacité !');continue}return{type:'move',m:mi}}
    if(c===1){const r=await bagScreen({battle:true});if(!r)continue;return{type:'item',...r}}
    if(c===2){const r=await partyScreen({battle:true});if(r===undefined||r<0)continue;if(r===BS.pi){await bsay(`${mname(mon)} est déjà au combat !`);continue}if(G.party[r].hp<=0){await bsay(`${mname(G.party[r])} n'a plus d'énergie pour se battre !`);continue}return{type:'switch',i:r}}

function foeChoose(){const E=BS.e,P=BS.p;const m=E.mon;
  if(!BS.wild&&BS.trItems>0&&m.hp>0&&m.hp<m.st[0]*.28&&R()<.65){return{type:'item'}}
  const opts=m.moves.map((mv,i)=>({mv,i})).filter(x=>x.mv.pp>0);if(!opts.length)return{type:'move',m:-1};
  if(BS.wild&&!SPECIES[m.sp].legend)return{type:'move',m:pick(opts).i};
  const pt=SPECIES[P.mon.sp].t;let best=null,bs=-1;
  for(const o of opts){const M=MOVES[o.mv.n];let sc;if(M.c!=='X'){const ef=typeEff(M.t,pt);const stab=SPECIES[m.sp].t.includes(M.t)?1.5:1;const ra=M.c==='P'?stat(E,'atk')/stat(P,'def'):stat(E,'spa')/stat(P,'spd');sc=M.p*ef*stab*ra*(M.a||100)/100;if(M.e.includes('recoil'))sc*=.85;if(M.pr&&P.mon.hp<P.mon.st[0]*.2)sc*=2}
    else{sc=0;const e0=M.e[0]||'';if(['par','brn','psn','tox','slp','frz'].includes(e0)&&!P.mon.status&&canStatus(P,e0))sc=e0==='slp'?60:40;else if(e0==='cnf'&&!P.cnf)sc=30;else if(e0==='heal')sc=m.hp<m.st[0]*.45?90:0;else if(e0.startsWith('s:')){const k=e0.split(':')[1];sc=E.stg[k]<2&&m.hp>m.st[0]*.6?35:0}else if(e0.startsWith('o:')){const k=e0.split(':')[1];sc=P.stg[k]>-2?18:0}}
    sc*=(0.85+R()*.3);if(sc>bs){bs=sc;best=o}}
  if(R()<.15)best=pick(opts);return{type:'move',m:best.i}}
function canStatus(S,st){const t=SPECIES[S.mon.sp].t;if(S.mon.status||S.mon.hp<=0)return false;if((st==='brn')&&t.includes('FEU'))return false;if((st==='psn'||st==='tox')&&(t.includes('POI')||t.includes('ACI')))return false;if(st==='frz'&&t.includes('GLA'))return false;if(st==='par'&&t.includes('ELE'))return false;return true}
async function doTurn(act){if(!BS)return;
  const fa=BS.e.mon.hp>0?foeChoose():null;
  if(act.type==='run'){if(!BS.wild){await bsay('Impossible de fuir un combat de dresseur !',60);return}
    BS.runs++;const ps=stat(BS.p,'spe'),es=stat(BS.e,'spe');const f=Math.floor(ps*128/es)+30*BS.runs;if(ps>=es||ri(0,255)<f%256||SPECIES[BS.e.mon.sp].legend&&R()<.5){sfx('door');await bsay('Tu prends la fuite !',40);BS.end='run';return}await bsay('Impossible de fuir !',50)}
  if(act.type==='switch'){await withdraw();await sendPlayer(act.i)}
  if(act.type==='item'){const r=await battleItem(act);if(BS.end)return;if(r==='nouse')return}
  if(fa&&fa.type==='item'){BS.trItems--;const it=BS.e.mon.lv>40?'Potion Max':BS.e.mon.lv>25?'Hyper Potion':'Super Potion';const h=ITEMS[it].heal;BS.e.mon.hp=Math.min(BS.e.mon.st[0],BS.e.mon.hp+h);sfx('heal');await bsay(`${BS.o.tr.name} utilise ${it} !`,40);await animHP(BS.e)}
  const order=[];if(act.type==='move')order.push(['p',act.m]);if(fa&&fa.type==='move')order.push(['e',fa.m]);
  const pri=(who,mi)=>{const S=who==='p'?BS.p:BS.e;const mv=mi<0?MOVES.Lutte:MOVES[S.mon.moves[mi].n];return mv.pr};
  order.sort((a,b)=>{const pa=pri(...a),pb=pri(...b);if(pa!==pb)return pb-pa;const sa=stat(a[0]==='p'?BS.p:BS.e,'spe'),sb=stat(b[0]==='p'?BS.p:BS.e,'spe');if(sa!==sb)return sb-sa;return R()-.5});
  let first=true;
  for(const [who,mi] of order){const A=who==='p'?BS.p:BS.e,D=who==='p'?BS.e:BS.p;if(A.mon.hp<=0||D.mon.hp<=0){first=false;continue}
    await execMove(A,D,mi,first);first=false;if(BS.end)return;if(await handleFaints())return;}
  // residual
  for(const S of[BS.p,BS.e]){if(!S||S.mon.hp<=0)continue;S.flinch=false;const m=S.mon;let d=0,msg='';
    if(m.status==='brn'){d=Math.max(1,Math.floor(m.st[0]/8));msg=`${bname(S)} souffre de sa brûlure !`}
    if(m.status==='psn'){d=Math.max(1,Math.floor(m.st[0]/8));msg=`${bname(S)} souffre du poison !`}
    if(m.status==='tox'){S.tox++;d=Math.max(1,Math.floor(m.st[0]*S.tox/16));msg=`${bname(S)} souffre du poison !`}
    if(d){m.hp=Math.max(0,m.hp-d);S.blink=12;await animHP(S);await bsay(msg,50);if(await handleFaints())return}}
}
async function execMove(A,D,mi,first){
  const m=A.mon;const isP=A===BS.p;let M=mi<0?MOVES.Lutte:MOVES[m.moves[mi].n];
  if(m.status==='slp'){m.slp--;if(m.slp<=0){m.status=null;await bsay(`${bname(A)} se réveille !`,50)}else{await bsay(`${bname(A)} dort profondément.`,50);return}}
  if(m.status==='frz'){if(R()<.2){m.status=null;await bsay(`${bname(A)} n'est plus gelé !`,50)}else{await bsay(`${bname(A)} est gelé !`,50);return}}
  if(A.flinch){A.flinch=false;await bsay(`${bname(A)} a peur et ne peut pas attaquer !`,50);return}
  if(A.cnf>0){A.cnf--;if(A.cnf===0)await bsay(`${bname(A)} n'est plus confus !`,40);else{await bsay(`${bname(A)} est confus !`,40);if(R()<.5){const dmg=Math.max(1,Math.floor(Math.floor(Math.floor(2*m.lv/5+2)*40*stat(A,'atk')/stat(A,'def'))/50)+2);m.hp=Math.max(0,m.hp-dmg);A.blink=12;sfx('hit');await animHP(A);await bsay('Il se blesse dans sa confusion !',50);return}}}
  if(m.status==='par'&&R()<.25){await bsay(`${bname(A)} est paralysé ! Il ne peut pas attaquer !`,50);return}
  if(mi>=0)m.moves[mi].pp=Math.max(0,m.moves[mi].pp-1);
  await bsay(`${bname(A)} utilise ${M.n} !`,30);

  const S={show:0,draw(){ctx.fillStyle='#101820';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(120,60,10,120,60,120);g.addColorStop(0,'#40506880');g.addColorStop(1,'#00000000');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(this.show===1){ctx.drawImage(charSheet('prof',PALS.prof),0,0,16,16,88,12,64,64)}if(this.show===2){ctx.drawImage(charSheet('prof',PALS.prof),0,0,16,16,40,12,64,64);ctx.drawImage(monSprite(SPX['Piouf'].id),136,20)}if(this.show===3){ctx.drawImage(charSheet('player',PALS.player),0,0,16,16,88,12,64,64)}},tick(){}};
  setScene(S);playMusic('town',true);await fade(0,16);S.show=1;
  await say(['Bonjour ! Bienvenue dans le monde des Créas !','Je m\'appelle Sorel. Mais tout le monde m\'appelle le Professeur des Créas !']);S.show=2;
  await say(['Ce monde est peuplé de créatures appelées Créas.','Pour certains, les Créas sont des compagnons. D\'autres les entraînent pour combattre.','Moi... j\'étudie les Créas. C\'est ma passion !']);S.show=1;
  while(true){await say('Mais d\'abord, parle-moi un peu de toi. Comment t\'appelles-tu ?');const n=await openW(new NameW('Ton nom ?','Mouadh'));G.name=n;S.show=3;if(await askYN(`${n}, c'est bien ça ?`))break;S.show=1}
  S.show=3;await say([`Parfait, ${G.name} !`,'Ton aventure dans la région de Kaïra va commencer. Un monde de rêves et d\'aventures t\'attend !','C\'est parti !']);
  await fade(1,20);setScene(World);const home=getMap('w0').blds.find(b=>b.kind==='home');enterMap(home.id,2,4,'e');G.lastHeal={map:home.id,x:4,y:4};await fade(0,20);await say('Maman est dans la maison. Parle-lui avec le bouton A !')}
function boot(){setScene(Title);playMusic('title');requestAnimationFrame(loop)}
document.getElementById('snd').addEventListener('click',()=>{audioInit();AU.on=!AU.on;if(G)G.opts.snd=AU.on?1:0;document.getElementById('snd').textContent=AU.on?'♪':'×';if(AU.on)playMusic(AU.want||'title',true);else stopMusic()});
document.getElementById('fs').addEventListener('click',()=>{const d=document.documentElement;try{if(!document.fullscreenElement&&!document.webkitFullscreenElement){const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){const p=f.call(d);if(p&&p.catch)p.catch(()=>{})}}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}}catch(e){}});
addEventListener('pagehide',()=>{});
boot();
